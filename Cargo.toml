[package]
name = "matrix-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
matrix-sdk = { version = "0.18.0", features = ["anyhow", "bundled-sqlite", "markdown"] }
rmcp = { version = "2.2.0", features = [
  "server",
  "schemars",
  "transport-io",
  "transport-streamable-http-server",
] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
assert_fs = "1.1.3"
