[package]
name = "matrix-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
matrix-sdk = { version = "0.18.0", features = ["anyhow", "bundled-sqlite", "markdown"] }
secrecy = "0.10.3"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
